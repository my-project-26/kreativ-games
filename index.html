<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kreativ-Games</title>
<style>
  :root {
    --bg: #fdf8f3;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #e8743b;
    --accent-soft: #fde7da;
    --line: #ece4dc;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a19;
      --card: #262422;
      --text: #f1ece7;
      --muted: #a9a29b;
      --accent: #f08a55;
      --accent-soft: #3a2a21;
      --line: #36322f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { margin: 0 0 10px; font-size: 1.6rem; }
  h1 span { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type="search"], select {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  input[type="search"] { flex: 1 1 220px; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600;
  }
  .chips { margin-top: 10px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; align-items: center; }
  .chip {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    font-weight: 500; white-space: nowrap; padding: 7px 12px;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); white-space: nowrap; margin-left: 4px; }
  main { padding: 16px; }
  .count { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .card.highlight { outline: 3px solid var(--accent); }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h2 { margin: 0; font-size: 1.12rem; }
  .fav { background: none; color: var(--muted); padding: 0 4px; font-size: 1.4rem; line-height: 1; }
  .fav.on { color: var(--accent); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--accent-soft); color: var(--text); font-size: .78rem; padding: 3px 8px; border-radius: 999px; }
  .tag.s { background: transparent; border: 1px dashed var(--accent); }
  .desc { margin: 0; }
  .material { font-size: .9rem; color: var(--muted); margin: 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .links a {
    text-decoration: none; font-size: .9rem; font-weight: 600;
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent);
  }
  .source { font-size: .78rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .more { display: block; margin: 20px auto 0; }
  footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 24px 16px 40px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Kreativ-<span>Games</span></h1>
    <div class="row">
      <input type="search" id="search" placeholder="Suchen (z. B. Luftballon, Ostern, Pappteller) …">
      <select id="age" aria-label="Alter des Kindes">
        <option value="0">Jedes Alter</option>
        <option value="3">für 3 Jahre</option>
        <option value="4">für 4 Jahre</option>
        <option value="5">für 5 Jahre</option>
        <option value="6">für 6 Jahre</option>
        <option value="8">für 8 Jahre</option>
        <option value="10">für 10+ Jahre</option>
      </select>
      <button id="random">🎲 Zufallsidee</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Mehr anzeigen</button>
</main>

<footer>
  Beschreibungen sind eigene Kurztexte. Anleitungen, Bilder und Videos liegen bei den verlinkten Quellen.<br>
  Altersangaben sind Richtwerte. Bei Kerzen, Heißkleber und Messern hilft ein Erwachsener.
</footer>

<script src="ideen.js?v=20261107-2"></script>
<script>
const KATEGORIEN = ["Alle", "Drinnen", "Draußen", "Basteln", "Experiment", "★ Favoriten"];
const STORE_KEY = "kreativgames-favoriten";
const SEITE = 60;

let aktiveKategorie = "Alle";
let ohneSammlungen = false;
let nurVideo = false;
let sichtbar = SEITE;
let favoriten = ladeFavoriten();

function ladeFavoriten() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function speichereFavoriten() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...favoriten])); } catch (e) {}
}

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function renderChips() {
  el("chips").innerHTML =
    KATEGORIEN.map(k =>
      `<button class="chip ${k === aktiveKategorie ? "active" : ""}" data-k="${esc(k)}">${esc(k)}</button>`
    ).join("") +
    `<label class="toggle"><input type="checkbox" id="nurEinzel" ${ohneSammlungen ? "checked" : ""}> nur Einzelideen</label>` +
    `<label class="toggle"><input type="checkbox" id="nurVideo" ${nurVideo ? "checked" : ""}> nur mit Video</label>`;
  el("chips").querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => { aktiveKategorie = b.dataset.k; sichtbar = SEITE; renderChips(); render(); })
  );
  el("nurEinzel").addEventListener("change", e => { ohneSammlungen = e.target.checked; sichtbar = SEITE; render(); });
  el("nurVideo").addEventListener("change", e => { nurVideo = e.target.checked; sichtbar = SEITE; render(); });
}

function gefiltert() {
  const q = el("search").value.trim().toLowerCase();
  const alter = Number(el("age").value);
  return IDEEN.filter(i => {
    if (aktiveKategorie === "★ Favoriten" && !favoriten.has(i.id)) return false;
    if (aktiveKategorie !== "Alle" && aktiveKategorie !== "★ Favoriten" && i.kategorie !== aktiveKategorie) return false;
    if (ohneSammlungen && i.sammlung) return false;
    if (nurVideo && !i.hatVideo) return false;
    if (alter && i.abAlter > alter) return false;
    if (q) {
      const text = `${i.name} ${i.beschreibung} ${i.material || ""} ${i.kategorie}`.toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });
}

function karte(i) {
  const fav = favoriten.has(i.id);
  return `
    <article class="card" id="card-${esc(i.id)}">
      <div class="card-head">
        <h2>${esc(i.name)}</h2>
        <button class="fav ${fav ? "on" : ""}" data-id="${esc(i.id)}" aria-label="Favorit">${fav ? "★" : "☆"}</button>
      </div>
      <div class="tags">
        <span class="tag">${esc(i.kategorie)}</span>
        <span class="tag">ab ${esc(i.abAlter)} J.</span>
        ${i.sammlung ? `<span class="tag s">Sammlung</span>` : ""}
        
      </div>
      <p class="desc">${esc(i.beschreibung)}</p>
      ${i.material ? `<p class="material"><strong>Material:</strong> ${esc(i.material)}</p>` : ""}
      <div class="links">
        <a href="${esc(i.anleitung)}" target="_blank" rel="noopener noreferrer">📖 Anleitung & Bilder ↗</a>
        ${i.video ? `<a href="${esc(i.video)}" target="_blank" rel="noopener noreferrer">▶ Video ↗</a>` : ""}
      </div>
      <div class="source">Quelle: ${esc(i.quelle)}</div>
    </article>`;
}

function render() {
  const liste = gefiltert();
  el("count").textContent = `${liste.length} von ${IDEEN.length} Ideen`;
  el("grid").innerHTML = liste.length
    ? liste.slice(0, sichtbar).map(karte).join("")
    : `<div class="empty">Keine Idee gefunden. Filter ändern?</div>`;
  el("more").hidden = liste.length <= sichtbar;
  el("grid").querySelectorAll(".fav").forEach(b =>
    b.addEventListener("click", () => {
      const id = b.dataset.id;
      favoriten.has(id) ? favoriten.delete(id) : favoriten.add(id);
      speichereFavoriten();
      render();
    })
  );
}

el("more").addEventListener("click", () => { sichtbar += SEITE; render(); });

el("random").addEventListener("click", () => {
  const liste = gefiltert().filter(i => !i.sammlung);
  const pool = liste.length ? liste : gefiltert();
  if (!pool.length) return;
  const zufall = pool[Math.floor(Math.random() * pool.length)];
  const alle = gefiltert();
  const pos = alle.indexOf(zufall);
  if (pos >= sichtbar) { sichtbar = pos + 1; render(); }
  document.querySelectorAll(".card.highlight").forEach(c => c.classList.remove("highlight"));
  const card = el(`card-${zufall.id}`);
  if (card) {
    card.classList.add("highlight");
    card.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
el("search").addEventListener("input", () => { sichtbar = SEITE; render(); });
el("age").addEventListener("change", () => { sichtbar = SEITE; render(); });

renderChips();
render();
</script>
</body>
</html>
